appId: com.example.testapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "registration.name"
    timeout: 15000

# Fill the form
- tapOn:
    id: "registration.name"
- inputText: "Faizan Ali"
- tapOn:
    id: "registration.email"
- inputText: "faizan.ali@example.com"
- tapOn:
    id: "registration.password"
- inputText: "value123"
- tapOn:
    id: "registration.confirmPassword"
- inputText: "value123"

# Close keyboard (tap the title, NOT hideKeyboard)
- tapOn:
    text: "Create your account"

# Date of birth: open picker, confirm the default date
- scrollUntilVisible:
    element:
      id: "registration.dateOfBirth"
    direction: DOWN
- tapOn:
    id: "registration.dateOfBirth"
- tapOn:
    text: "(?i)ok"
    optional: true
- tapOn:
    id: "registration.dateOfBirth.done"
    optional: true

# Continue to verification
- scrollUntilVisible:
    element:
      id: "registration.continue"
    direction: DOWN
- tapOn:
    id: "registration.continue"
- assertVisible: "Verify your account"

# Verification
- tapOn:
    id: "verification.code"
- inputText: "123456"
- tapOn:
    text: "Verify your account"
- tapOn: "I accept the terms and conditions"
- tapOn:
    id: "verification.submit"
- extendedWaitUntil:
    visible:
      id: "success.screen"
    timeout: 10000
- assertVisible: "Welcome, Faizan Ali! Your account has been created successfully."