appId: com.example.testapp
name: "iOS - Unhappy: passwords do not match"
tags:
  - ios
  - regression
---
# Only the confirmation field is flagged; the password itself is valid.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "registration.name"
    timeout: 15000

# Fill the form
- tapOn:
    id: "registration.name"
- inputText: "Faizan Ali"
- tapOn:
    id: "registration.email"
- inputText: "faizan.ali@example.com"
- tapOn:
    id: "registration.password"
- inputText: "value123"
- tapOn:
    id: "registration.confirmPassword"
- inputText: "value456"

# Close keyboard (tap the title)
- tapOn: "Create your account"

# Date of birth: open the wheel, confirm the default date (today - 25 years)
- scrollUntilVisible:
    element:
      id: "registration.dateOfBirth"
    direction: DOWN
- tapOn:
    id: "registration.dateOfBirth"
- tapOn:
    id: "registration.dateOfBirth.done"

# Press Continue
- scrollUntilVisible:
    element:
      id: "registration.continue"
    direction: DOWN
- tapOn:
    id: "registration.continue"

# Expected
- assertVisible:
    id: "registration.confirmPasswordError"
    text: "Passwords do not match."
- assertNotVisible:
    id: "registration.passwordError"
- assertNotVisible: "Verify your account"
