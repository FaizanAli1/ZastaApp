appId: com.example.testapp
name: "iOS - Happy path: successful registration"
tags:
  - ios
  - smoke
---
# Full registration, summary check, welcome message and a clean form after restart.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "registration.name"
    timeout: 15000

# Fill the form
- tapOn:
    id: "registration.name"
- inputText: "Faizan Ali"
- tapOn:
    id: "registration.email"
- inputText: "faizan.ali@example.com"
- tapOn:
    id: "registration.password"
- inputText: "value123"
- tapOn:
    id: "registration.confirmPassword"
- inputText: "value123"

# Close keyboard (tap the title)
- tapOn: "Create your account"

# Date of birth: open the wheel, confirm the default date (today - 25 years)
- scrollUntilVisible:
    element:
      id: "registration.dateOfBirth"
    direction: DOWN
- tapOn:
    id: "registration.dateOfBirth"
- tapOn:
    id: "registration.dateOfBirth.done"

# Press Continue
- scrollUntilVisible:
    element:
      id: "registration.continue"
    direction: DOWN
- tapOn:
    id: "registration.continue"
- assertVisible: "Verify your account"

# Verification screen shows the entered data
- assertVisible:
    id: "verification.name"
    text: "Faizan Ali"
- assertVisible:
    id: "verification.email"
    text: "faizan.ali@example.com"

# Enter code and close the number pad
- tapOn:
    id: "verification.code"
- inputText: "123456"
- tapOn: "Verify your account"
- tapOn: "checkbox, unchecked"
- assertVisible: "checkbox, checked"
- tapOn:
    id: "verification.submit"

# Verification is simulated with a 600-1200 ms delay -> wait
- extendedWaitUntil:
    visible:
      id: "success.screen"
    timeout: 10000
- assertVisible: "Welcome, Faizan Ali! Your account has been created successfully."
- takeScreenshot: ios_happy_path_success

# New registration starts with an empty form
- tapOn:
    id: "success.restart"
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 5000
- assertNotVisible: "Faizan Ali"
- assertNotVisible: "faizan.ali@example.com"
