appId: com.example.testapp
name: "Unhappy: user younger than 16"
tags:
  - regression
  - android
---
# A birth date that makes the user younger than 16 must be rejected.
- evalScript: ${output.defaultYear = String(new Date().getFullYear() - 25)}
- evalScript: ${output.underageYear = String(new Date().getFullYear())}

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "registration.name"
    timeout: 15000

# Fill the form
- tapOn:
    id: "registration.name"
- inputText: "Faizan Ali"
- tapOn:
    id: "registration.email"
- inputText: "faizan.ali@example.com"
- tapOn:
    id: "registration.password"
- inputText: "value123"
- tapOn:
    id: "registration.confirmPassword"
- inputText: "value123"

# Close keyboard (tap the title, NOT hideKeyboard)
- tapOn:
    text: "Create your account"

# Open the date picker
- scrollUntilVisible:
    element:
      id: "registration.dateOfBirth"
    direction: DOWN
- tapOn:
    id: "registration.dateOfBirth"

# Switch year: tap the year in the dialog header, then pick the underage year
- tapOn:
    text: ${output.defaultYear}
- scrollUntilVisible:
    element:
      text: ${output.underageYear}
    direction: DOWN
- tapOn:
    text: ${output.underageYear}
- tapOn:
    text: "(?i)ok"
- tapOn:
    id: "registration.dateOfBirth.done"
    optional: true

# Press Continue
- scrollUntilVisible:
    element:
      id: "registration.continue"
    direction: DOWN
- tapOn:
    id: "registration.continue"

# Expected
- assertVisible: "You must be at least 16 years old."
- assertNotVisible: "Verify your account"